# ─────────────────────────────────────────────────────────────────────
# Terminal capabilities — fixes stray color-query replies (rgb:xxxx/xxxx
# fragments) leaking into the opencode input box at redraw boundaries.
# Root cause: opentui (opencode's TUI) sends OSC 10/11 background/fg color
# queries; iTerm2's reply travels back through tmux with no pane identity
# and lands as raw input. Declaring Cs:Cr makes tmux answer these queries
# ITSELF instead of forwarding to iTerm2, so the reply is framed correctly
# and never leaks. (see opentui#1459, opencode#40035)
# ─────────────────────────────────────────────────────────────────────
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -ga terminal-features ",*:RGB:Cs:Cr"

set-option -g focus-events on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# ─────────────────────────────────────────────────────────────────────
# Bells / activity
# ─────────────────────────────────────────────────────────────────────
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour39

# copy mode
setw -g mode-style 'fg=colour235 bg=colour39 bold'

# panes
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'

# ─────────────────────────────────────────────────────────────────────
# Status bar — flat design
# Palette: colour235=dark bg, colour238=mid grey, colour245=dim text,
#          colour39=blue accent, colour250=light text, black=on-accent text
# ─────────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour250 bg=colour235'
set -g status-interval 120

# Left: session name in a blue accent block
set -g status-left '#[fg=black,bg=colour39,bold] #S #[fg=colour39,bg=colour235] '
set -g status-left-length 30

# Right: PR status + date/time. Flat — date/time in dim text, no pills.
set -g status-right '#(~/.local/bin/tmux-prs) #[fg=colour245]%a %d %b #[fg=colour250,bold]%H:%M '
set -g status-right-length 80

# ─────────────────────────────────────────────────────────────────────
# Window tabs — flat, color driven by window-status-style so the
# tmux-agent-indicator plugin can recolor a window that needs attention
# (needs-input=yellow, done=red). Format carries NO hardcoded fg/bg.
# ─────────────────────────────────────────────────────────────────────
set -g window-status-separator ''

# Inactive: dim grey text on the status bg
setw -g window-status-style 'fg=colour245 bg=colour235'
setw -g window-status-format ' #I #W '

# Active: light text, subtle grey block, blue underline accent
setw -g window-status-current-style 'fg=colour250 bg=colour238 bold'
setw -g window-status-current-format ' #I #W '

# Bell / attention fallback (native bell path)
setw -g window-status-bell-style 'fg=black bg=colour208 bold'

# messages
set -g message-style 'fg=black bg=colour39 bold'

# ─────────────────────────────────────────────────────────────────────
# tmux-prs status click binding. tmux-prs emits mouse ranges named after
# the clicked target ("myprs", or "pr<number>" per attention PR) and writes
# a "<range> <url>" lookup table to ~/.cache/tmux-prs-comments-url. On a
# status click we look up the clicked range name in that table and open its
# URL. A click on any range not in the table (e.g. a window tab) falls back
# to the default select-window behaviour.
# ─────────────────────────────────────────────────────────────────────
bind -n MouseDown1Status \
  if -F '#{||:#{m:pr*,#{mouse_status_range}},#{==:#{mouse_status_range},myprs}}' \
    'run-shell "~/.local/bin/tmux-prs-open #{mouse_status_range}"' \
    'select-window -t='

# ─────────────────────────────────────────────────────────────────────
# New window running opencode (fresh session) from ~/repos/chainalysis.
#   prefix + O  -> new window, cd ~/repos/chainalysis, interactive zsh, opencode
#
# OpenCode's provider config reads LLM_API_* from ~/.zsh_secrets. tmux windows
# created with a command bypass shell initialization, so invoke interactive zsh.
# ─────────────────────────────────────────────────────────────────────
bind O new-window -c '#{HOME}/repos/chainalysis' 'zsh -ic "exec opencode"'

# ─────────────────────────────────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "accessd/tmux-agent-indicator"

# tmux-agent-indicator — hook-driven (OpenCode plugin reports state).
# opencode intentionally NOT in the process list: we only want a signal
# when a session NEEDS attention, not whenever opencode is merely running.
set -g @agent-indicator-icons 'claude=🤖,codex=🧠,opencode=💻,default=🤖'
set -g @agent-indicator-processes 'claude,codex'
set -g @agent-indicator-indicator-enabled 'on'
set -g @agent-indicator-border-enabled 'on'
set -g @agent-indicator-reset-on-focus 'on'
set -g @agent-indicator-notification-enabled 'on'
set -g @agent-indicator-notification-states 'needs-input,done'

# Per-window tab coloring on agent state (shows through the flat format above)
set -g @agent-indicator-needs-input-window-title-bg 'colour214'
set -g @agent-indicator-needs-input-window-title-fg 'black'
set -g @agent-indicator-done-window-title-bg 'colour39'
set -g @agent-indicator-done-window-title-fg 'black'

# Load plugins once per tmux server rather than once for every shell pane.
run-shell -b 'tpack init'
